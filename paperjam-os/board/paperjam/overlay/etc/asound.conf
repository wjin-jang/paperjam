# PaperJam OS - ALSA Configuration
# /etc/asound.conf

# Default to PulseAudio for all ALSA applications
pcm.!default {
    type pulse
    hint.description "PulseAudio Sound Server"
}

ctl.!default {
    type pulse
}

# Direct hardware access (bypasses PulseAudio)
pcm.hw0 {
    type hw
    card 0
}

# Software mixing for multiple streams
pcm.dmixer {
    type dmix
    ipc_key 1024
    slave {
        pcm "hw:0"
        period_time 0
        period_size 1024
        buffer_size 4096
        rate 44100
    }
    bindings {
        0 0
        1 1
    }
}
