# PaperJam OS - PulseAudio Daemon Configuration
# /etc/pulse/daemon.conf

# Run as system daemon
daemonize = yes
allow-module-loading = no
allow-exit = no

# Use system mode
system-instance = yes

# Realtime scheduling (improves audio quality)
realtime-scheduling = yes
realtime-priority = 5
high-priority = yes
nice-level = -11

# Memory management
lock-memory = no
enable-memfd = yes

# Logging
log-target = syslog
log-level = notice

# Sample specification
default-sample-format = s16le
default-sample-rate = 44100
default-sample-channels = 2
default-channel-map = front-left,front-right

# Fragment settings (affects latency vs CPU usage)
default-fragments = 4
default-fragment-size-msec = 25

# Resampling (quality vs CPU)
resample-method = speex-float-1
enable-remixing = yes
enable-lfe-remixing = no

# Optimizations for low-power device
flat-volumes = no
deferred-volume = yes
deferred-volume-safety-margin-usec = 8000
deferred-volume-extra-delay-usec = 0

# Exit when idle (disabled for system mode)
exit-idle-time = -1

# SHM settings
shm-size-bytes = 0
enable-shm = yes
