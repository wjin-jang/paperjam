# PaperJam OS - WPA Supplicant Configuration
# /etc/wpa_supplicant.conf
# Configure your WiFi networks below

ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=netdev
update_config=1
country=US

# Power saving
p2p_disabled=1

