<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PaperJam</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
    <meta name="theme-color" content="#121218">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        // Apply cached theme instantly to prevent flash
        (function() {
            var t = localStorage.getItem('pj-theme');
            if (t) document.documentElement.dataset.theme = t;
        })();
    </script>
</head>
<body>
    <div class="app-shell" id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="app-title-bar">
                <div class="app-title">PaperJam</div>
            </div>
            <nav class="app-nav" id="main-nav">
                <button data-view="library"><span class="icon" style="-webkit-mask-image:url(/static/icons/ui/bm_tracks_16.png);mask-image:url(/static/icons/ui/bm_tracks_16.png)"></span> Library</button>
                <button data-view="artists"><span class="icon" style="-webkit-mask-image:url(/static/icons/ui/bm_artist_16.png);mask-image:url(/static/icons/ui/bm_artist_16.png)"></span> Artists</button>
                <button data-view="albums"><span class="icon" style="-webkit-mask-image:url(/static/icons/ui/bm_album_16.png);mask-image:url(/static/icons/ui/bm_album_16.png)"></span> Albums</button>
                <button data-view="playlists"><span class="icon" style="-webkit-mask-image:url(/static/icons/ui/bm_playlist_16.png);mask-image:url(/static/icons/ui/bm_playlist_16.png)"></span> Playlists</button>
                <button data-view="recents"><span class="icon" style="-webkit-mask-image:url(/static/icons/ui/bm_recent_16.png);mask-image:url(/static/icons/ui/bm_recent_16.png)"></span> Recents</button>
                <button data-view="favorites"><span class="icon" style="-webkit-mask-image:url(/static/icons/ui/bm_heart_16.png);mask-image:url(/static/icons/ui/bm_heart_16.png)"></span> Favorites</button>
                <button data-view="search"><span class="icon" style="-webkit-mask-image:url(/static/icons/ui/bm_qmark_16.png);mask-image:url(/static/icons/ui/bm_qmark_16.png)"></span> Search</button>
                <button data-view="settings"><span class="icon" style="-webkit-mask-image:url(/static/icons/ui/bm_eq_16.png);mask-image:url(/static/icons/ui/bm_eq_16.png)"></span> Settings</button>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="app-content" id="content">
            <div class="loading">Loading library</div>
        </main>

        <!-- Player Bar — compact: progress line + single row -->
        <div class="player-bar empty" id="player-bar">
            <div class="player-progress" id="progress-bar">
                <div class="player-progress-fill" id="progress-fill"></div>
            </div>
            <div class="player-main">
                <div class="player-cover" id="player-cover-click">
                    <img id="player-cover" src="" alt="">
                </div>
                <div class="player-info" id="player-info-click">
                    <div class="player-title" id="player-title">&mdash;</div>
                    <div class="player-meta">
                        <span id="player-artist">&mdash;</span>
                        <span class="player-time"><span id="time-current">0:00</span> / <span id="time-total">0:00</span></span>
                    </div>
                </div>
                <div class="player-controls">
                    <button id="btn-shuffle" title="Shuffle"><span class="icon" style="-webkit-mask-image:url(/static/icons/ui/bm_hash_16.png);mask-image:url(/static/icons/ui/bm_hash_16.png)"></span></button>
                    <button id="btn-prev" title="Previous"><span class="icon" style="-webkit-mask-image:url(/static/icons/ui/bm_lt_16.png);mask-image:url(/static/icons/ui/bm_lt_16.png)"></span></button>
                    <button id="btn-play" class="btn-play" title="Play"><span class="icon icon-24" style="-webkit-mask-image:url(/static/icons/ui/bm_gt_24.png);mask-image:url(/static/icons/ui/bm_gt_24.png)"></span></button>
                    <button id="btn-next" title="Next"><span class="icon" style="-webkit-mask-image:url(/static/icons/ui/bm_gt_16.png);mask-image:url(/static/icons/ui/bm_gt_16.png)"></span></button>
                    <button id="btn-loop" title="Loop"><span class="icon" style="-webkit-mask-image:url(/static/icons/ui/ds_endless_16.png);mask-image:url(/static/icons/ui/ds_endless_16.png)"></span></button>
                </div>
                <div class="player-actions">
                    <button id="btn-fav" title="Favorite"><span class="icon" style="-webkit-mask-image:url(/static/icons/ui/bm_heart_16.png);mask-image:url(/static/icons/ui/bm_heart_16.png)"></span></button>
                    <button id="btn-queue" title="Queue"><span class="icon" style="-webkit-mask-image:url(/static/icons/ui/bm_playlist_16.png);mask-image:url(/static/icons/ui/bm_playlist_16.png)"></span></button>
                    <div class="volume-control">
                        <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="100">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="context-menu" hidden></div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay" hidden>
        <div class="modal">
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/player.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
