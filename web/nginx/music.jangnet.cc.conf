# PaperJam Web — Nginx configuration for music.jangnet.cc
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/

upstream paperjam {
    server 127.0.0.1:8800;
}

server {
    listen 80;
    server_name music.jangnet.cc;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name music.jangnet.cc;

    # SSL — adjust paths to your certbot/acme certs
    ssl_certificate /etc/letsencrypt/live/music.jangnet.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.jangnet.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Max upload (for potential future use)
    client_max_body_size 100M;

    # Streaming: disable request buffering for audio
    proxy_request_buffering off;

    # Static files — served directly by nginx
    location /static/ {
        alias /opt/paperjam-web/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Audio streaming — larger timeouts, no buffering
    location /api/stream/ {
        proxy_pass http://paperjam;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Cover art — cacheable
    location /api/cover/ {
        proxy_pass http://paperjam;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 24h;
    }

    # All other requests to FastAPI
    location / {
        proxy_pass http://paperjam;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
